{% load i18n %}
<div class="flex flex-col gap-4 py-4 first:pt-0 last:pb-0 sm:flex-row sm:items-center sm:justify-between">
    <div class="min-w-0">
        <p class="font-semibold text-lab-950">
            {{ material.localized_title }}
            {% if material.access_level == "internal" %}
                <span class="ml-2 inline-flex rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600">{% translate "Для сотрудников" %}</span>
            {% endif %}
        </p>
        {% if material.localized_description %}
            <p class="mt-1 metadata">{{ material.localized_description }}</p>
        {% endif %}
    </div>
    <a href="{% url 'education:download_material' material.pk %}" class="text-link shrink-0 text-sm">{% translate "Скачать ↓" %}</a>
</div>
