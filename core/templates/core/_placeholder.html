{% extends "core/base.html" %}

{% block content %}
<section class="bg-paper py-20 sm:py-24 lg:py-32">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">
        <div class="max-w-3xl">
            <p
                class="text-sm font-semibold uppercase tracking-[0.18em] text-energy-500"
            >
                {% block page_label %}ЛХВЭ{% endblock %}
            </p>

            <h1
                class="mt-4 text-5xl font-semibold tracking-[-0.05em] text-lab-950 sm:text-6xl"
            >
                {% block page_heading %}{% endblock %}
            </h1>

            <p class="mt-6 max-w-2xl text-lg leading-8 text-slate-600">
                {% block page_intro %}
                    Раздел находится в разработке.
                {% endblock %}
            </p>

            <div class="mt-10 flex flex-wrap gap-3">
                {% block page_actions %}{% endblock %}

                <a
                    href="{% url 'core:home' %}"
                    class="inline-flex min-h-12 items-center justify-center rounded-full border border-slate-300 px-6 text-sm font-semibold text-lab-950 transition-colors hover:border-lab-950 hover:bg-white"
                >
                    На главную
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
