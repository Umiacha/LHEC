{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="{{ pagination_label|default:'Страницы' }}">
    {% if page_obj.has_previous %}
        <a href="{% querystring page=page_obj.previous_page_number %}" class="text-link">← Назад</a>
    {% endif %}
    <span class="metadata">Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a href="{% querystring page=page_obj.next_page_number %}" class="text-link">Далее →</a>
    {% endif %}
</nav>
{% endif %}
